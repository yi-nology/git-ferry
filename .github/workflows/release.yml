name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'

      - name: Run tests
        run: go test -v ./...

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # SQLite 驱动已改用纯 Go 的 glebarez/sqlite(modernc 内核),
          # 全平台交叉编译无需 C 工具链,统一关闭 CGO。
          CGO_ENABLED: 0
        run: |
          # 带平台后缀,避免 6 个二进制同名碰撞(release 资产才能各平台独立)
          binary_name="git-ferry-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            binary_name="${binary_name}.exe"
          fi
          # 版本号编译注入(tag 触发时 GITHUB_REF_NAME 即 v1.7.x 形式的 tag)
          go build -ldflags "-X github.com/yi-nology/git-ferry/internal/version.Version=${GITHUB_REF_NAME}" -o "./dist/${binary_name}" .

      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CLI_BIN="gitferry"
          ARCHIVE_EXT=".tar.gz"
          if [ "$GOOS" = "windows" ]; then
            CLI_BIN="gitferry.exe"
            ARCHIVE_EXT=".zip"
          fi
          mkdir -p cli-build
          go build -ldflags "-s -w -X main.Version=${GITHUB_REF_NAME}" -o "cli-build/${CLI_BIN}" ./cmd/gitferry
          ARCHIVE="gitferry_${VERSION}_${GOOS}_${GOARCH}${ARCHIVE_EXT}"
          if [ "$GOOS" = "windows" ]; then
            (cd cli-build && zip -q "../dist/${ARCHIVE}" "${CLI_BIN}")
          else
            tar -czf "dist/${ARCHIVE}" -C cli-build "${CLI_BIN}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: git-ferry-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ./dist/*

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ./artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f ! -name checksums.txt | sort | xargs sha256sum > checksums.txt
          cat checksums.txt

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG="Initial release"
          else
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          body: |
            ## Changes
            ${{ steps.changelog.outputs.changelog }}

            ## Artifacts

            - `checksums.txt` - SHA256 checksums for all artifacts

            ### Server
            - `git-ferry-linux-amd64` - Linux x86_64
            - `git-ferry-linux-arm64` - Linux ARM64
            - `git-ferry-darwin-amd64` - macOS x86_64
            - `git-ferry-darwin-arm64` - macOS ARM64 (Apple Silicon)
            - `git-ferry-windows-amd64.exe` - Windows x86_64
            - `git-ferry-windows-arm64.exe` - Windows ARM64

            ### CLI (`gitferry`)
            - `gitferry_<ver>_<os>_<arch>.tar.gz` / `.zip` — 6 platforms
            - npm: `npm install -g gitferry-cli` then `gitferry-install-skills`
          files: ./artifacts/**/*
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm:
    name: Publish npm (optional)
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ !contains(github.ref, '-rc') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Build npm package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          bash scripts/build-npm.sh

      - name: Publish to npm
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "NPM_TOKEN not set; skipping npm publish"
            exit 0
          fi
          cd npm-pkg
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
