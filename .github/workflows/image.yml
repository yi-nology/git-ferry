# 镜像发布:构建 + 推 GHCR + 打 tag
#
# 为什么单独一个文件而不是并进 release.yml:
# release.yml 的产物是**二进制与 CLI 包**(给「下载即用」的场景),
# 镜像是**另一种交付形态**(给「docker run 即起」的场景),两者的
# 触发条件、凭据、失败影响面都不同 ⇒ 独立 job,互不阻塞。
#
# 触发:
#   - push tag `v*`  → 推 `ghcr.io/yi-nology/git-ferry:<version>` 与 `:latest`
#   - 手动 dispatch  → 推 `:<branch>-<sha>` 预览镜像(不覆盖 latest)
#
# 凭据:GITHUB_TOKEN(内置,包权限需勾 packages: write)。
# GHCR 免登录拉取需把包设为 public(仓库 Settings → Packages)。

name: Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像 tag（留空用 sha 短串）'
        required: false
        type: string

permissions:
  contents: read
  packages: write

# 与 release.yml 一致:自家模块系列不走公开代理与 checksum DB。
# 三家 org 前缀都直连 GitHub——goproxy 对刚发布的 tag 有负缓存,CI 追新会间歇 404。
env:
  GOPRIVATE: github.com/oagentkit/*,github.com/oekit/*,github.com/yi-nology/*
  GOPROXY: https://goproxy.cn,direct
  GOSUMDB: sum.golang.google.cn

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 算出本次要推的 tag 列表,后续 buildx 与 meta 两个 action 共用。
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,format=short

      # --load 不加:多架构产物无法 load 进本地 docker,靠 push 落库。
      # --sbom / --provenance 出供应链元数据,便于审计追溯。
      - name: Build & push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

      - name: Verify image is pullable
        run: |
          # 推送后回读一次:确认 tag 真的落库,且 manifest 支持多架构。
          docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}" \
            --format '{{json .Manifest}}' | head -c 400
          echo
          echo "✓ image published"
