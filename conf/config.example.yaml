server:
  host: 0.0.0.0
  port: 8890
  mode: debug
  api_key: "change-me-to-a-strong-random-key"
  api_key_role: admin        # admin | operator | readonly

database:
  driver: sqlite
  dsn: data/git_sync.db
  max_idle_conns: 10
  max_open_conns: 100

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0

git:
  backend: gogit
  temp_dir: /tmp/git-sync

sync:
  max_concurrent: 5
  default_timeout: 300
  retry_count: 3
  backup_dir: data/bundles   # git bundle 冷备目录(任务开启 git_bundle 时)
  backup_keep: 5             # 每任务保留最近 N 份,0=不轮转
  partial_clone: ""          # blob:none / tree:0 部分克隆,空=全量
  backup_encrypt_key: ""     # AES-256-GCM 冷备加密(base64 32B 或口令);空=不加密
  backup_retention_days: 90  # 冷备保留天数,0=不按天清理
  legal_hold: false          # true=合规冻结,禁止自动清理
  backup_s3:                 # bundle 异地冷备(S3 兼容);空=只存本地
    endpoint: ""
    region: ""
    bucket: ""
    prefix: ""
    access_key: ""
    secret_key: ""
    path_style: false
  backup_destinations:       # 多目的地扇出(与 backup_s3 并存,逐个独立上传)
    # - type: s3             # s3 | webdav | azure | local
    #   name: oss
    #   endpoint: https://oss-cn-hangzhou.aliyuncs.com
    #   region: oss-cn-hangzhou
    #   bucket: my-bundles
    #   prefix: ferry
    #   access_key: ""
    #   secret_key: ""
    #   path_style: false
    # - type: webdav
    #   name: nas
    #   url: https://nas.local/dav/bundles
    #   username: ""
    #   password: ""
    # - type: azure
    #   name: azure
    #   account_name: myacct
    #   account_key: ""
    #   container: bundles
    #   prefix: ferry

auth:
  # OIDC/JWT Bearer(HS256);启用后优先于 X-API-Key
  oidc:
    enabled: false
    secret: ""               # HS256 共享密钥
    issuer: ""
    audience: ""
    role_claim: role         # JWT 角色声明键
    user_claim: sub
    default_role: readonly   # admin | operator | readonly

webhook:
  rate_limit: 100
  max_body_size: 10485760

log:
  level: info
  format: json

# AI 助手(eino):默认关闭。启用需同时:
#   1. 打开下方 ai 段;2. 设置环境变量 GIT_SYNC_AI_API_KEY
# base_url 可指向任意 OpenAI 兼容端点;生产内网可指向 vLLM/Ollama,如:
#   ai:
#     enabled: true
#     base_url: "http://127.0.0.1:11434/v1"
#     model: "qwen2.5:14b"
#     temperature: 0.3        # 可选,默认 0.3
#     max_tokens: 2048        # 可选,默认 2048
#     timeout_seconds: 60     # 可选,默认 60
#     max_concurrent_chats: 4 # 可选,默认 4

# 运行观察与失败补偿(壳层):轮询执行历史,派发通知/指标,失败自动重跑
runwatch:
  interval_seconds: 30
  history_limit: 10
  retry:
    max_auto_retries: 2      # 0=不自动重跑
    cooldown_minutes: 5

# 通知矩阵(壳层):运行完成推送 + 成功/失败分路心跳(healthchecks.io)
# notify:
#   only_fail: true          # 只通知失败,降低噪声
#   ntfy:
#     - url: "https://ntfy.sh"
#       topic: "gitferry-alerts"
#       # token: "..."       # 或 user/password
#       events: ["failed"]   # 空=success+failed
#   gotify:
#     - url: "https://gotify.example.com"
#       token: "..."
#   heartbeat:
#     interval_seconds: 60
#     success_urls:
#       - "https://hc-ping.com/your-uuid"
#     fail_urls:
#       - "https://hc-ping.com/your-uuid"

# 平台令牌可用环境变量注入(不进配置/请求体):
#   GIT_SYNC_TOKEN_<PLATFORM_NAME 大写,非字母数字换 _>
#   例:platform name=my-github → GIT_SYNC_TOKEN_MY_GITHUB=ghp_xxx
