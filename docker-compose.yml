services:
  git-ferry:
    build: .
    ports:
      - "8890:8890"
    volumes:
      - ./conf:/app/conf
      - git-sync-data:/app/data
    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  git-sync-data:
  redis-data:
